<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body id="body">
    <button onclick="changeColor()">Change body color</button>
    <h1 id="heading">My name is Ali Hussain</h1>
    <button onclick="changeText()">Change</button>

    <ul id="fruits">
        <li class="list-item">Apple</li>
        <li class="list-item">Banana</li>
        <li class="list-item">Mango</li>
        <li class="list-item">Orange</li>
    </ul>
</body>
<script>
    head=document.getElementById("heading")
    head.innerText='My name is Ahmad'
    function changeText(){
        head.textContent='I am a student'
        head.style.color="blue"
        head.style.fontSize="70px"

    }

    list = document.getElementById("fruits")
    list.classList.add("unordered-list")
</script>
</html>
